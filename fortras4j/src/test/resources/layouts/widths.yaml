# An invented layout for counting widths in characters or bytes.
id: widths
format: WIDTHS
release: "1"
detect: "^NAM"
maxLineLength: 28

records:
  NAM:
    fields:
      - { name: name, start: 4, end: 9 }
      - { name: city, start: 10, end: 15, align: right }
      - { name: exact, start: 16, end: 19, overflow: error }
      - { name: count, start: 20, end: 22, type: integer, pad: "0", align: right }
      - repeat: notes
        start: 23
        count: 2
        stride: 3
        fields:
          - { name: text, start: 1, end: 3 }

structure:
  - { record: NAM, occurs: "1..*" }
