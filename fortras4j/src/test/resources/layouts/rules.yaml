# An invented layout for value rules and the datetime type.
id: rules
format: RULES
release: "1"
detect: "^SCN"
maxLineLength: 40

codelists:
  kind:
    codes: [AA, BB, CC]

records:
  SCN:
    fields:
      - { name: kind, start: 4, end: 5, type: code, codelist: kind }
      - { name: hub, start: 6, end: 7 }
      - { name: status, start: 8, end: 10, type: integer, null: blanks }
      - { name: stamp, start: 11, end: 26, type: datetime, pattern: ddMMyyyyHHmmssSS }

rules:
  status:
    record: SCN
    field: status
    severity: warning
    cases:
      - when: { kind: AA }
        allowed: [100, 101]
      - when: { kind: BB, hub: [X1, X2] }
        allowed: [200]
    otherwise: [1, 2]

structure:
  - { record: SCN, occurs: "1..*" }
