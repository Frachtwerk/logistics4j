name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual fallback: select the release tag (not a branch) as the ref when
  # dispatching, since release creation and versioning derive from github.ref.
  workflow_dispatch:

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Check that the tag matches the POM version
        run: |
          version=$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match POM version $version."
            exit 1
          fi
      - name: Build, test and check formatting
        run: mvn -B -ntp verify

  trivy-repo-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Pre-populate Maven repository
        # package instead of dependency:resolve, so the modules resolve each other from the reactor
        run: mvn -B -ntp -DskipTests package
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'UNKNOWN,CRITICAL,HIGH'
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: 'trivy-results.sarif'

  create-github-release:
    needs:
      - verify
      - trivy-repo-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create Release Notes
        run: |
          VERSION_DIVIDER="${{ vars.VERSION_DIVIDER || '## Version ' }}"
          awk -v version_divider="$VERSION_DIVIDER" '
          $0 ~ version_divider {
              if (count == 0) {
                  count++;
                  next
              } else if (count == 1) {
                  exit
              }
          }
          count == 1 {
              print
          }' ./CHANGELOG.md > RELEASE_NOTES.md
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md

  deploy:
    needs: create-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: central
          server-username: MAVEN_USERNAME # env variable for username in deploy
          server-password: MAVEN_PASSWORD # env variable for token in deploy
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
          cache: 'maven'
      - name: Publish to Maven Central
        run: mvn -B -ntp deploy -Prelease -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
